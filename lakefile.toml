name = "GsimOT"
version = "0.1.0"
defaultTargets = ["GsimOT", "ThinMatching"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedSectionVars = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "GsimOT"

[[lean_lib]]
name = "ThinMatching"
